server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  # The stock mime.types has no .mjs, and browsers refuse to run a module
  # script served as application/octet-stream (breaks the pdf.js worker).
  location ~* \.mjs$ {
    root /usr/share/nginx/html;
    types { text/javascript mjs; }
    try_files $uri =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
